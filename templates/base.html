{% load static %}
<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
        {% block title %}<title>Hiking Tracker</title>{% endblock %}
        <link rel="icon" type="image/x-icon" href="{% static 'assets/favicon.ico' %}" />
        <!-- Font Awesome icons (free version)-->
        <script src="https://use.fontawesome.com/releases/v6.3.0/js/all.js" crossorigin="anonymous"></script>
        <!-- Google fonts-->
        <link href="https://fonts.googleapis.com/css?family=Varela+Round" rel="stylesheet" />
        <link href="https://fonts.googleapis.com/css?family=Nunito:200,200i,300,300i,400,400i,600,600i,700,700i,800,800i,900,900i" rel="stylesheet" />
        <!-- Core theme CSS (includes Bootstrap)-->
        <link href="{% static 'css/styles.css' %}" rel="stylesheet" />
        <!-- Hiking tracker UI layer-->
        <link href="{% static 'css/hiking.css' %}" rel="stylesheet" />
    </head>

    <body id="page-top">
        <!-- Navigation-->
        <nav class="navbar navbar-expand-lg navbar-light fixed-top" id="mainNav">
            <div class="container px-4 px-lg-5">
                <a class="navbar-brand" href="index.html"><i class="fas fa-mountain-sun brand-mark"></i>Hiking Tracker</a>
                <button class="navbar-toggler navbar-toggler-right" type="button" data-bs-toggle="collapse" data-bs-target="#navbarResponsive" aria-controls="navbarResponsive" aria-expanded="false" aria-label="Toggle navigation">
                    Menu
                    <i class="fas fa-bars"></i>
                </button>
                <div class="collapse navbar-collapse" id="navbarResponsive">
                    <ul class="navbar-nav ms-auto">
                        <li class="nav-item"><a class="nav-link" href="#hikes">My hikes</a></li>
                        <li class="nav-item"><a class="nav-link" href="hike-form.html">Add hike</a></li>
                        <li class="nav-item"><a class="nav-link" href="accounts/login/">Log in</a></li>
                    </ul>
                </div>
            </div>
        </nav>
        {% load static %}
        <!-- Masthead-->
        <header class="masthead">
            <div class="container px-4 px-lg-5 d-flex h-100 align-items-center justify-content-center">
                <div class="d-flex justify-content-center">
                    <div class="text-center">
                        <h1 class="mx-auto my-0 text-uppercase">Hiking Tracker</h1>
                        <h2 class="text-white-50 mx-auto mt-2 mb-5">A simple logbook for your hikes: where you went, how far, and how much you climbed.</h2>
                        <a class="btn btn-primary" href="#hikes">See my hikes</a>
                    </div>
                </div>
            </div>
        </header>
        <!-- Hikes-->
      {% block content %}

      {% endblock %}
      <footer class="footer-app text-center">
                  <div class="container px-4 px-lg-5">Hiking Tracker</div>
              </footer>
              <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js"></script>
              <script src="{% static 'js/scripts.js' %}"></script>
          </body>
      </html>
