
    <body>
        <main class="auth-page">
            <div class="container px-4 px-lg-5">
                <div class="auth-card">
                    <a class="auth-brand" href="index.html"><i class="fas fa-mountain-sun brand-mark"></i>Trailhead</a>
                    <h1>Log in</h1>
                    <!-- Error example - render above the form when credentials are wrong:
                    <div class="alert alert-danger rounded-0 py-2 small">That username and password do not match.</div>
                    -->
                    <form method="post" action="#">
                        <div class="mb-3">
                            <label class="form-label" for="username">Username</label>
                            <input class="form-control" id="username" name="username" type="text" autocomplete="username" required />
                        </div>
                        <div class="mb-4">
                            <label class="form-label" for="password">Password</label>
                            <input class="form-control" id="password" name="password" type="password" autocomplete="current-password" required />
                        </div>
                        <div class="d-grid">
                            <button class="btn btn-primary btn-app" type="submit">Log in</button>
                        </div>
                    </form>
                </div>
            </div>
        </main>
