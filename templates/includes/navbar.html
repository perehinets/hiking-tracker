<nav class="navbar navbar-expand-lg navbar-light fixed-top" id="mainNav">
  <div class="container px-4 px-lg-5">
    <a class="navbar-brand" href="{% url 'tracker:index' %}"><i class="fas fa-mountain-sun brand-mark"></i>Hiking
      Tracker</a>
    <button class="navbar-toggler navbar-toggler-right" type="button" data-bs-toggle="collapse"
            data-bs-target="#navbarResponsive" aria-controls="navbarResponsive" aria-expanded="false"
            aria-label="Toggle navigation">
      Menu
      <i class="fas fa-bars"></i>
    </button>
    <div class="collapse navbar-collapse" id="navbarResponsive">
      <ul class="navbar-nav ms-auto">
        {% if user.is_authenticated %}
          {% if request.resolver_match.url_name == "profile" %}
            <li class="nav-item"><a class="nav-link" href="{% url 'tracker:index' %}">All hikes</a></li>
          {% else %}
            <li class="nav-item"><a class="nav-link" href="{% url 'tracker:profile' %}">My hikes</a></li>
          {% endif %}
          <form action="{% url 'logout' %}" method="post">
            {% csrf_token %}
            <button type="submit" class="nav-link nav-logout">
              Log out
            </button>
          </form>
        {% else %}
          <li class="nav-item"><a class="nav-link" href="{% url 'login' %}?next={{ request.path }}">Log in</a></li>
        {% endif %}
      </ul>
    </div>
  </div>
</nav>
