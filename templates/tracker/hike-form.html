<main class="app-main">
  <div class="container px-4 px-lg-5">
    <div class="row">
      <div class="col-lg-8">
        <form class="form-panel" method="post" action="#">
          <div class="row g-3">
            <div class="col-12">
              <label class="form-label" for="title">Route</label>
              <input class="form-control" id="title" name="title" type="text" placeholder="Hoverla via Zaroslyak"
                     required/>
              <!-- Error example - render this when the field has errors:
              <div class="invalid-feedback d-block">Give this hike a title.</div>
              -->
            </div>
            <div class="col-md-7">
              <label class="form-label" for="location">Place</label>
              <input class="form-control" id="location" name="location" type="text"
                     placeholder="Chornohora, Carpathians"/>
            </div>
            <div class="col-md-5">
              <label class="form-label" for="date">Date</label>
              <input class="form-control" id="date" name="date" type="date" required/>
            </div>
            <div class="col-md-4">
              <label class="form-label" for="distance">Distance (km)</label>
              <input class="form-control" id="distance" name="distance_km" type="number" step="0.1" min="0"
                     placeholder="18.4"/>
            </div>
            <div class="col-md-4">
              <label class="form-label" for="elevation">Elevation gain (m)</label>
              <input class="form-control" id="elevation" name="elevation_gain_m" type="number" step="1" min="0"
                     placeholder="1180"/>
            </div>
            <div class="col-md-4">
              <label class="form-label" for="difficulty">Difficulty</label>
              <select class="form-select" id="difficulty" name="difficulty">
                <option value="easy">Easy</option>
                <option value="moderate" selected>Moderate</option>
                <option value="hard">Hard</option>
              </select>
            </div>
            <div class="col-12">
              <label class="form-label" for="notes">Notes</label>
              <textarea class="form-control" id="notes" name="notes" rows="4"
                        placeholder="Conditions, who came along..."></textarea>
            </div>
          </div>
          <div class="d-flex flex-wrap gap-2 mt-4">
            <button class="btn btn-primary btn-app" type="submit">Save hike</button>
            <a class="btn btn-outline-secondary btn-app" href="index.html">Cancel</a>
          </div>
        </form>
      </div>
    </div>
  </div>
</main>
