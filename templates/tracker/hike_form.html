{% extends 'base.html' %}
{% block title %}<title>Hiking Tracker - Add new hike</title>{% endblock %}

{% block content %}
{% include 'includes/navbar.html' %}
  <!-- Masthead-->
  <header class="profile-page-header"></header>
  <main class="app-main">
    <div class="container px-4 px-lg-5">
      <div class="row">
        <div class="col-lg-8">
          <form class="form-panel" method="post" action="#">
            <div class="row g-3">
              <div class="col-12">
                <label class="form-label" for="title">Route</label>
                <input class="form-control" id="title" name="title" type="text" placeholder="Hoverla via Zaroslyak"
                       required/>
                <!-- Error example - render this when the field has errors:
                <div class="invalid-feedback d-block">Give this hike a title.</div>
                -->
              </div>
              <div class="col-md-5">
                <label class="form-label" for="max_hikers">Maximum hikers</label>
                <input class="form-control" id="max_hikers" name="location" type="number"
                       placeholder="20"/>
              </div>
              <div class="col-md-7">
                <label class="form-label" for="date">Date</label>
                <input class="form-control" id="date" name="date" type="date" required/>
              </div>
              <div class="col-12">
                <label class="form-label" for="notes">Description</label>
                <textarea class="form-control" id="notes" name="notes" rows="4"
                          placeholder="Conditions, who came along..."></textarea>
              </div>
            </div>
            <div class="d-flex flex-wrap gap-2 mt-4">
              <button class="btn btn-primary btn-app" type="submit">Create hike</button>
              <a class="btn btn-outline-secondary btn-app" href="{% url 'tracker:profile' %}">Cancel</a>
            </div>
          </form>
        </div>
      </div>
    </div>
  </main>
{% endblock %}
