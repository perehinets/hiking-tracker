{% extends 'base.html' %}
{% load crispy_forms_filters %}
{% block title %}<title>Hiking Tracker - Add new ROUTE</title>{% endblock %}

{% block content %}
{% include 'includes/navbar.html' %}
  <!-- Masthead-->
  <header class="profile-page-header"></header>
  <main class="app-main">
    <div class="container px-4 px-lg-5">
      <div class="row">
        <div class="col-lg-8">
          <form class="form-panel" action="" method="post" novalidate>
            {% csrf_token %}
            {{ form|crispy }}

              <button class="btn btn-primary btn-app" type="submit">Create route</button>
              <a class="btn btn-outline-secondary btn-app" href="{% url 'tracker:profile' %}">Cancel</a>
          </form>
        </div>
      </div>
    </div>
  </main>
{% endblock %}
