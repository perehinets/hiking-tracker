{% extends 'base.html' %}
{% block title %}<title>Hiking Tracker - Add new hike</title>{% endblock %}

{% block content %}
{% include 'includes/navbar.html' %}
  <!-- Masthead-->
  <header class="profile-page-header"></header>
  <main class="app-main">
    <div class="container px-4 px-lg-5">
      <div class="row">
        <div class="col-lg-8">
          <form class="form-panel" method="post" action="#">
            <div class="row g-3">
              <div class="col-12">
                <label class="form-label" for="title">Name</label>
                <input class="form-control" id="title" name="title" type="text" placeholder="Hoverla via Zaroslyak"
                       required/>
                <!-- Error example - render this when the field has errors:
                <div class="invalid-feedback d-block">Give this hike a title.</div>
                -->
              </div>
              <div class="col-md-12">
                <label class="form-label" for="location">Place</label>
                <input class="form-control" id="location" name="location" type="text"
                       placeholder="Chornohora, Carpathians"/>
              </div>
              <div class="col-md-4">
                <label class="form-label" for="distance">Distance (km)</label>
                <input class="form-control" id="distance" name="distance_km" type="number" step="0.1" min="0"
                       placeholder="18.4"/>
              </div>
              <div class="col-md-4">
                <label class="form-label" for="elevation">Elevation gain (m)</label>
                <input class="form-control" id="elevation" name="elevation_gain_m" type="number" step="1" min="0"
                       placeholder="1180"/>
              </div>
              <div class="col-md-4">
                <label class="form-label" for="difficulty">Difficulty</label>
                <select class="form-select" id="difficulty" name="difficulty">
                  <option value="1">Easy</option>
                  <option value="2" selected>Moderate</option>
                  <option value="3">Hard</option>
                  <option value="4">Alpine</option>
                </select>
              </div>
            </div>
            <div class="d-flex flex-wrap gap-2 mt-4">
              <button class="btn btn-primary btn-app" type="submit">Create route</button>
              <a class="btn btn-outline-secondary btn-app" href="{% url 'tracker:profile' %}">Cancel</a>
            </div>
          </form>
        </div>
      </div>
    </div>
  </main>
{% endblock %}
